version = 1

SPDX-PackageName = "Authelia"
SPDX-PackageSupplier = "Authelia <team@authelia.com>"
SPDX-PackageDownloadLocation = "https://github.com/authelia/authelia"

[[annotations]]
path = "**"
precedence = "closest"

[[annotations]]
path = [
	"cmd/authelia-gen/templates/dot_commitlintrc.cjs.tmpl",
	"cmd/dev/**",
	"internal/authentication/users_database.template.json",
	"internal/configuration/test_resources/**",
	"internal/storage/migrations/**",
	"internal/suites/common/pki/**",
	"internal/suites/example/compose/authelia/resources/reflex.conf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Authelia"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "web/src/components/UI/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 shadcn"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "internal/session/memory/stdlib.go"
precedence = "override"
SPDX-FileCopyrightText = "2016 The Go Authors"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = [
  "internal/suites/testdata/fonts/LICENSE",
  "internal/suites/testdata/fonts/LiberationSans-Regular.ttf",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2010 Google Corporation",
  "2012 Red Hat, Inc.",
]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "web/src/assets/images/applestore-badge.svg"
precedence = "override"
SPDX-FileCopyrightText = "Apple, Inc."
SPDX-License-Identifier = "LicenseRef-Trademark"

[[annotations]]
path = ".github/readme/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Authelia"
SPDX-License-Identifier = "Apache-2.0"
