# Development configuration for the administration UI, see README.md. It mirrors a typical deployment which uses the
# template filter to read secrets from files and values from the environment.
server:
  address: 'tcp4://127.0.0.1:9095'
  disable_healthcheck: true

log:
  level: info

identity_validation:
  elevated_session:
    require_second_factor: true
  reset_password:
    jwt_lifespan: '5 minutes'
    jwt_secret: {{ secret "DATA/secrets/jwt_secret.txt" | mindent 0 "|" | msquote }}

identity_providers:
  oidc:
    hmac_secret: {{ secret "DATA/secrets/oidc_hmac_secret.txt" | mindent 0 "|" | msquote }}
    minimum_parameter_entropy: 8
    lifespans:
      access_token: 1h
      authorize_code: 1m
      id_token: 1h
      refresh_token: 90d
    jwks:
      - key: {{ secret "DATA/secrets/oidc.key" | mindent 10 "|" | msquote }}
    clients:
      - client_id: nextcloud
        client_name: Nextcloud
        client_secret: '$pbkdf2-sha512$310000$c8p78n7pUMln0jzvd4aK4Q$JNRBzwAo0ek5qKn50cFzzvE9RXV88h1wJn5KGiHrD0YKtZaR/nCb2CJPOsKaPK0hjf.9yHxzQGZziziccp6Yng'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        redirect_uris:
          - 'https://{{ env "NEXTCLOUD_URL" }}/apps/oidc_login/oidc'
        scopes:
          - openid
          - profile
          - email
          - groups
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic

      - client_id: immich
        client_name: Immich
        client_secret: '$pbkdf2-sha512$310000$c8p78n7pUMln0jzvd4aK4Q$JNRBzwAo0ek5qKn50cFzzvE9RXV88h1wJn5KGiHrD0YKtZaR/nCb2CJPOsKaPK0hjf.9yHxzQGZziziccp6Yng'
        public: false
        authorization_policy: two_factor
        consent_mode: implicit
        redirect_uris:
          - 'https://{{ env "IMMICH_URL" }}/auth/login'
          - 'app.immich:///oauth-callback'
        scopes: ['openid', 'profile', 'email', 'groups']
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'

totp:
  disable: false
  issuer: '{{ env "DOMAIN" }}'
  period: 30
  skew: 1

password_policy:
  zxcvbn:
    enabled: true
    min_score: 4

authentication_backend:
  file:
    path: 'DATA/users.yml'
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65535
        parallelism: 4
        key_length: 32
        salt_length: 16
  password_reset:
    disable: false

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'traefik.{{ env "DOMAIN" }}'
      policy: 'two_factor'
    - domain: 'vessel.{{ env "DOMAIN" }}'
      policy: bypass
      resources:
        - '^/api/update/latest$'
    - domain: 'vessel.{{ env "DOMAIN" }}'
      policy: 'two_factor'

session:
  name: 'authelia_session'
  secret: {{ secret "DATA/secrets/session_secret.txt" | mindent 0 "|" | msquote }}
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://idm.{{ env "DOMAIN" }}'
      expiration: 1h
      inactivity: 1d
      remember_me: 1M

regulation:
  max_retries: 4
  find_time: 2m
  ban_time: 30m

storage:
  encryption_key: {{ secret "DATA/secrets/storage_encryption_key.txt" | mindent 0 "|" | msquote }}
  local:
    path: 'DATA/db.sqlite3'

notifier:
  filesystem:
    filename: 'DATA/notification.txt'

webauthn:
  disable: false
  display_name: Authelia
  attestation_conveyance_preference: indirect
  timeout: 60s
  enable_passkey_login: true
  selection_criteria:
    user_verification: required

theme: 'auto'

administration:
  enabled: true
